<script>
document.addEventListener('DOMContentLoaded', function() {
  const carouselEl = document.getElementById('carouselExample');

  // Configuración de los 3 libros
  const books = [
    { id: 'book', pages: '.my-page', instance: null },
    { id: 'book2', pages: '.my-page2', instance: null },
    { id: 'book3', pages: '.my-page3', instance: null }
  ];

  const pageFlipOptions = {
    width: 200,
    height: 283,
    size: 'stretch',
    minWidth: 150,
    maxWidth: 300,
    minHeight: 212,
    maxHeight: 424,
    maxShadowOpacity: 0,
    showCover: true
  };

  // Función para inicializar un libro únicamente cuando es visible
  function loadBook(index) {
    const book = books[index];
    if (book && !book.instance) {
      const container = document.getElementById(book.id);
      if (container) {
        book.instance = new St.PageFlip(container, pageFlipOptions);
        book.instance.loadFromHTML(document.querySelectorAll(book.pages));
      }
    }
  }

  // 1. Cargar el primer libro inmediatamente (ya está visible)
  loadBook(0);

  // 2. Cargar los siguientes libros cuando el carrusel cambia de diapositiva
  carouselEl.addEventListener('slide.bs.carousel', function(event) {
    loadBook(event.to); // event.to indica el número de diapositiva activa (0, 1 o 2)
  });
});
</script>
