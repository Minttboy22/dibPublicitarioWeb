<style>

body {
  font-family: "play";
  background: rgb(227, 255, 240);
  margin: 0;
}

.header {
  display: flex;
  position: fixed;
  justify-content: space-evenly;
  height: fit-content;
  width: 100%;
  margin-bottom: 36px;
  background-color: #1fd474;
  color: rgb(227, 255, 240);
  align-items: center;
  font-weight: 700;
  z-index: 10;
  font-size: 36px;
  animation: linksHeight linear forwards;
  animation-timeline: scroll(root block);
  animation-range: 0% 10%;
}

@keyframes linksHeight {
  to {
    font-size: 24px;
    background-color: #1fd47475;
  }
}

.sketchbooksHeader:hover,
.minttboyHeader:hover,
.contactHeader:hover {
  cursor: pointer;

}

.minttboy {
  position: relative;
  top: 100px;
  text-align: center;
}

.sketchbook {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 20px;
  position: relative;
  top: 200px;
}

.skPlaceholder {
  background: linear-gradient(90deg, blue 50%, orangered 50%);
  width: 400px;
  height: 200px;
  margin-top: 8px;
}

.container-book, .container-book2 {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

#book {
  background: transparent; /* Sin marco ni fondos grises */;
  margin-top: 160px;
}

#book2 {
  margin-top: 50px;
}

.my-page, 
.my-page2 {
  background-color: #fff;
}

.my-page img, 
.my-page2 img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.dibDigitales {
  display: grid;
  grid-template-columns: 1fr 1fr;
  text-align: center;
  margin-top: 60px;

}

.ddPlaceholder {
  width: 150px;
  height: 200px;
  background: blue;
  margin: 0 auto;
  margin-top: 8px;
  margin-bottom: 24px;
}

.contact {
  text-align: center;
  background-color: #1fd474;
  margin-top: 100px;
  padding: 24px 0 24px 0;
  color: rgb(227, 255, 240);
  font-weight: 700;
  font-size: 20px;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
<script>document.addEventListener('DOMContentLoaded', function() {
  const pageFlip = new St.PageFlip(document.getElementById('book'), {
    width: 200,          // Ancho de una sola página en px
    height: 283,         // Alto de una sola página en px
    size: 'stretch',
    minWidth: 150,
    maxWidth: 300,
    minHeight: 212,
    maxHeight: 424,
    maxShadowOpacity: 0,
    showCover: true      // La primera página actúa como portada individual
  });

  pageFlip.loadFromHTML(document.querySelectorAll('.my-page'));
});</script>
