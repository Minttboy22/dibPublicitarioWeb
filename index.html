<style>

html {
  font-family: "play";
  background: rgb(4, 73, 36);
  color: white;
  margin: 0;
  scroll-behavior: smooth;
}

a {
  color: white;
}

.header {
  display: flex;
  position: fixed;
  justify-content: space-evenly;
  height: fit-content;
  width: 100%;
  margin-bottom: 36px;
  background-color: /*#1fd474*/ transparent;
  color: rgb(14, 141, 73);
  align-items: center;
  font-weight: 700;
  z-index: 10;
}

.sketchbooksHeader,
.minttboyHeader,
.contactHeader {
  color: white;
  background-color: #1fd474;
  font-size: 30px;
  padding: 0 12px;
  margin-top: 16px;
  border-radius: 8px;
  animation: linksHeight linear forwards;
  animation-timeline: scroll(root block);
  animation-range: 0% 10%;
}

@keyframes linksHeight {
  to {
    font-size: 30px;
    border-radius: 8px;
    opacity: 50%;
  }
}

.sketchbooksHeader:hover,
.minttboyHeader:hover,
.contactHeader:hover {
  cursor: pointer;
  animation: idle 0.6s infinite alternate;
}

@keyframes idle {
  to {
    transform: scale(1.1);
    filter: brightness(110%);
    box-shadow: 0px 0px 15px 5px rgb(98, 230, 168);
  }
}

.minttboy {
  position: relative;
  top: 100px;
  text-align: center;
}

.sketchbook {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 20px;
  position: relative;
  top: 200px;
}

.skPlaceholder {
  background: linear-gradient(90deg, blue 50%, orangered 50%);
  width: 400px;
  height: 200px;
  margin-top: 8px;
}

.container-book, .container-book2, .container-book3 {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

#book {
  background: transparent; /* Sin marco ni fondos grises */;
  margin-top: 160px;
  filter: drop-shadow(-10px 20px 12px #000000);
}

#book2, #book3 {
  margin-top: 50px;
  filter: drop-shadow(-10px 20px 12px #000000);
}

.my-page, 
.my-page2,
.my-page3 {
  background-color: #fff;
}

.my-page img, 
.my-page2 img,
.my-page3 img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.dibDigitales {
  display: grid;
  grid-template-columns: 1fr 1fr;
  text-align: center;
  margin-top: 60px;

}

.ddPlaceholder {
  width: 150px;
  height: 200px;
  background: blue;
  margin: 0 auto;
  margin-top: 8px;
  margin-bottom: 24px;
}

.contact {
  text-align: center;
  background-color: #1fd474;
  margin-top: 100px;
  padding: 24px 0 24px 0;
  color: rgb(227, 255, 240);
  font-weight: 700;
  font-size: 20px;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
<script>document.addEventListener('DOMContentLoaded', function() {
  const pageFlip = new St.PageFlip(document.getElementById('book'), {
    width: 200,          // Ancho de una sola página en px
    height: 283,         // Alto de una sola página en px
    size: 'stretch',
    minWidth: 150,
    maxWidth: 300,
    minHeight: 212,
    maxHeight: 424,
    maxShadowOpacity: 0,
    showCover: true      // La primera página actúa como portada individual
  });

  pageFlip.loadFromHTML(document.querySelectorAll('.my-page'));
});</script>
